name: Options Scan

on:
  schedule:
    # 12:30 UTC is 18:00 IST, after the NSE session.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily Upstox scan
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -m services.run_scans --config config_options_daily.yaml