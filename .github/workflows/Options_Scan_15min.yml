name: Options Scan 15min

on:
  schedule:
    # GitHub cron uses UTC. These run at 09:28, then every 15 minutes through 15:13 IST.
    - cron: "58 3 * * 1-5"
    - cron: "13,28,43,58 4-8 * * 1-5"
    - cron: "13,28,43 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 15-minute Upstox scan
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -m services.run_scans --config config_options_15min.yaml