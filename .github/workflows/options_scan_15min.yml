name: Options Scan 15min

on:
  schedule:
    # GitHub cron uses UTC. 4:00-8:45 UTC + 9:00-9:30 UTC = 9:30 AM-3:00 PM IST, every 15 min.
    - cron: "*/15 4-8 * * MON-FRI"
    - cron: "0,15,30 9 * * MON-FRI"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 15-minute Upstox options scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -m services.run_scans --config config_options_15min.yaml
