scans:
  - name: NSE options daily
    provider: upstox
    csv_path: indian_options.csv
    instrument_key_column: instrument_key
    stock_column: stock
    interval: daily
    history_days: 365
    include_today_intraday: false
    strategies:
    strategies:
      - function: check_dynamic_price_volume_spike
        parameters:
          lookback: 50
          price_multiplier: 2.2
          volume_multiplier: 2.2
      - function: check_ema20_bearish_rejection
        parameters:
          proximity_threshold: 0.005
      - function: check_ema20_bullish_support
        parameters:
          proximity_threshold: 0.015

